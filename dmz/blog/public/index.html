<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMZ Blog</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    main {
      max-width: 720px;
      margin: 4rem auto;
      padding: 2rem;
      background: #ffffff;
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin-top: 0;
    }
    code {
      display: inline-block;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      background: #eef3fb;
    }
  </style>
</head>
<body>
  <main>
    <h1>DMZ Blog</h1>
    <p>This site is deployed to the DMZ Raspberry Pi from the homelab repo.</p>
    <p>Deploy with: <code>scripts/dmz-app up blog</code></p>
  </main>
</body>
</html>
