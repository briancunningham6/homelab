# Copyparty Configuration — Homelab Platform
#
# Auth model: Caddy forward-auth (Authentik) → IdP header injection → Copyparty
# Users authenticate at Authentik; Caddy copies headers; Copyparty reads them.
# No local [accounts] section required — Authentik is the identity source.
#
# Volume substitution:
#   ${u}  = authenticated username (from Authentik)
#   ${g}  = group name (from Authentik)
#   @su   = the superuser group (copyparty-admin members)

[global]
# ── Reverse proxy ──────────────────────────────────────────────────────────
# Caddy sits in front — trust XFF headers from private network ranges
rproxy: 1
xff-src: lan
xff-hdr: x-forwarded-for

# ── Authentik IdP header authentication ────────────────────────────────────
# These headers are injected by Caddy after Authentik authenticates the user.
# The secret header (idp-h-key) proves the headers aren't spoofed by clients —
# Caddy adds it; Copyparty rejects requests that don't include it.
idp-h-usr: x-authentik-username
idp-h-grp: x-authentik-groups
idp-h-key: x-cp-secret
idp-store: 3

# ── Features ───────────────────────────────────────────────────────────────
-e2d             # Upload tracking database (enables unpost / undo upload)
-e2t             # Audio metadata indexing (artist, album, duration)


# ── Superuser group ─────────────────────────────────────────────────────────
# Members of the Authentik group 'copyparty-admin' get admin rights.
# Add any other admin groups here (comma-separated or one per line).
[groups]
su: copyparty-admin


# ── Volumes ─────────────────────────────────────────────────────────────────
# Virtual paths match physical paths under /w (the library bind mount).
#
# Permission flags:
#   r  = read (browse + download)
#   w  = write (upload)
#   m  = move
#   d  = delete
#   a  = admin (all of the above + config management)

# Root — authenticated users can see the top-level structure only.
# Admins have full control.
[/]
/w
  accs:
    r: *
    a: @su

# Shared family folder — everyone can read; parents group can write.
# To add users to the parents group, add them to the Authentik 'parents' group.
[/shared]
/w/shared
  accs:
    r: *
    rw: @parents
    a: @su

# Per-user home directories — created automatically on first login.
# ${u} is substituted with the authenticated username.
[/users/${u}]
/w/users/${u}
  accs:
    r: @su
    rwd: ${u}

# Per-user private area — only the user and admins can access.
[/users/${u}/priv]
/w/users/${u}/priv
  accs:
    a: @su
    a: ${u}

# Read-only media library — all authenticated users can browse and download.
# Point this at your existing media directories as needed.
[/media]
/w/media
  accs:
    r: *
    a: @su
